<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: black; color: white; font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 30%; background: #111; padding: 20px; display: flex; flex-direction: column; align-items: center; border-right: 4px solid red; box-sizing: border-box; }
        .main-content { width: 70%; display: flex; justify-content: center; align-items: center; background: #000; position: relative; }
        .clock { font-size: 80px; font-weight: bold; margin-bottom: 10px; }
        .weather { width: 100%; height: 300px; border: none; }
        #display-img { max-width: 95%; max-height: 95%; object-fit: contain; transition: opacity 1s; opacity: 1; }
        .fade-out { opacity: 0 !important; }
        #info-tag { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.7); padding: 5px 15px; border-radius: 5px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div id="clock" class="clock">00:00</div>
        <iframe class="weather" src="https://wttr.in/Helsinki?0&m&q&lang=fi"></iframe>
        <div style="margin-top: auto; text-align: center;">
            <h2 style="color: red;">MALMIN TAEKWONDO</h2>
        </div>
    </div>

    <div class="main-content">
        <div id="info-tag">TÄRKEÄ TIEDOTE</div>
        <img id="display-img" src="" alt="Ladataan...">
    </div>

    <script>
        // --- KUVAT JA ASETUKSET ---
        // Käytä vaikeita nimiä tiedostoille yksityisyyden takia!
        const satunnaisetKuvat = [
            "kuvat/treeni_x92.jpg", 
            "kuvat/treeni_z12.jpg",
            "kuvat/treeni_a44.jpg"
        ];

        const tarkeatKuvat = [
            "kuvat/ohjaaja_esittely_v88.jpg",
            "kuvat/tärkeä_tiedote_k22.jpg"
        ];

        let tarkeatIndeksi = 0;
        let onkoTarkeaNaytolla = false;
        const imgElement = document.getElementById('display-img');
        const tagElement = document.getElementById('info-tag');

        // FUNKTIO: Näytä tavallinen satunnainen kuva
        function naytaSatunnainen() {
            if (onkoTarkeaNaytolla) return;
            imgElement.classList.add('fade-out');
            setTimeout(() => {
                const r = Math.floor(Math.random() * satunnaisetKuvat.length);
                imgElement.src = satunnaisetKuvat[r];
                tagElement.style.display = "none";
                imgElement.classList.remove('fade-out');
            }, 1000);
        }

        // FUNKTIO: Näytä tärkeä kuva (keskeytys)
        function naytaTarkea() {
            onkoTarkeaNaytolla = true;
            imgElement.classList.add('fade-out');
            setTimeout(() => {
                imgElement.src = tarkeatKuvat[tarkeatIndeksi];
                tagElement.style.display = "block"; // Näytetään pieni punainen tagi
                imgElement.classList.remove('fade-out');
                
                tarkeatIndeksi = (tarkeatIndeksi + 1) % tarkeatKuvat.length;

                // Palaa satunnaisiin 30 sekunnin kuluttua
                setTimeout(() => {
                    onkoTarkeaNaytolla = false;
                    naytaSatunnainen();
                }, 30000); 
            }, 1000);
        }

        // AJASTIMET
        setInterval(naytaSatunnainen, 20000); // Vaihda treenikuva 20s välein
        setInterval(naytaTarkea, 300000);      // Keskeytä tärkeällä kuvalla 5min välein

        // Kello
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fi-FI', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        // Käynnistys
        naytaSatunnainen();
    </script>
</body>
</html>
