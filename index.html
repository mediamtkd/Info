<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: black; color: white; font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* VASEN SIVUPALKKI (30%) */
        .sidebar { 
            width: 30%; 
            background: #111; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            border-right: 4px solid red; /* Tehdään punaisesta viivasta hieman paksumpi */
            box-sizing: border-box;
        }
        
        /* OIKEA SISÄLTÖALUE (70%) */
        .main-content { 
            width: 70%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #000;
            position: relative;
        }

        .clock { font-size: 80px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .weather { width: 100%; height: 300px; border: none; }
        
        /* KUVAN TYYLI LOKEROSSA */
        #rotating-image {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain; /* Pitää kuvan suhteet oikeana, ei venytä */
            transition: opacity 1s ease-in-out; /* Pehmeä vaihto */
            opacity: 1;
        }

        .fade-out { opacity: 0 !important; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div id="clock" class="clock">00:00</div>
        <iframe class="weather" src="https://wttr.in/Helsinki?0&m&q&lang=fi"></iframe>
        
        <div style="margin-top: auto; padding-bottom: 20px; text-align: center;">
            <h2 style="color: red;">MALMIN TAEKWONDO</h2>
            <p>Tervetuloa treeneihin!</p>
        </div>
    </div>

    <div class="main-content">
