<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: black; color: white; font-family: Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 30%; background: #111; padding: 20px; display: flex; flex-direction: column; align-items: center; border-right: 2px solid red; }
        .main-content { width: 70%; position: relative; }
        .clock { font-size: 80px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .weather { width: 100%; border: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div id="clock" class="clock">00:00</div>
        <iframe class="weather" src="https://www.accuweather.com/en/fi/helsinki/133328/weather-forecast/133328"></iframe>
        <p style="margin-top: 20px; text-align: center;">Malmin Taekwondo</p>
    </div>
    <div class="main-content">
        <iframe src="https://www.instagram.com/malmintaekwondo"></iframe>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('fi-FI', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('clock').innerText = time;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
